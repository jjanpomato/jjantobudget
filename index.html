<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🚑 데이터 구조대</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #fff5f5;">
  <h2 style="color: #e8453c;">🚑 데이터 구조대</h2>
  <p>데이터는 안전합니다! 아래 버튼을 눌러 숨어있는 데이터를 찾아주세요.</p>
  <button onclick="scanData()" style="padding: 12px 20px; font-size: 16px; font-weight: bold; background: #e8453c; color: white; border: none; border-radius: 8px; cursor: pointer;">🔍 내 데이터 찾기</button>
  
  <div style="margin-top: 20px;">
    <label style="font-weight: bold; color: #333;">[진단 결과] 아래 상자 안의 내용을 모두 복사해서 채팅창에 붙여넣어 주세요!</label>
    <textarea id="output" style="width: 100%; height: 400px; margin-top: 10px; padding: 10px; border-radius: 8px; border: 2px solid #fddcdc; font-family: monospace; font-size: 13px;" readonly></textarea>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB2Z-WDaJtq_kjhMyjfnkM1l3qZxitZobE",
      authDomain: "jjanpomato.firebaseapp.com",
      databaseURL: "https://jjanpomato-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "jjanpomato",
      storageBucket: "jjanpomato.firebasestorage.app"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function scanData() {
      let output = document.getElementById("output");
      output.value = "데이터 스캔 중...\n\n";

      // URL에 키가 있는지, 혹은 로컬 스토리지에 키가 있는지 확인
      const urlParams = new URLSearchParams(window.location.search);
      let localSyncKey = urlParams.get('key') || localStorage.getItem("syncKey");
      
      output.value += "[1] 현재 연동 키 (syncKey): " + (localSyncKey || "없음") + "\n\n";

      output.value += "[2] 핸드폰/PC (로컬 스토리지)에 남아있는 과거 데이터 확인:\n";
      ['iD', 'eD', 'nvD', 'scD', 'asD', 'lgD'].forEach(k => {
         let data = localStorage.getItem(k);
         if (data && data !== "{}" && data !== "[]" && data !== "null") {
             output.value += `- ${k}: 존재함 (크기: ${data.length}자)\n`;
             if (k === 'nvD' || k === 'scD' || k === 'iD' || k === 'eD') {
                 output.value += `  -> 앞부분 샘플: ${data.substring(0, 150)}...\n`;
             }
         } else {
             output.value += `- ${k}: 비어있음\n`;
         }
      });

      if (localSyncKey) {
         output.value += "\n[3] 파이어베이스(서버) 데이터 스캔 중...\n";
         db.ref("users/" + localSyncKey).once('value', function(snapshot) {
            let data = snapshot.val();
            if (data) {
                output.value += "- 서버에서 데이터를 찾았습니다!\n\n";
                output.value += "=== 전체 데이터 백업본 (아래 내용을 복사해주세요) ===\n";
                output.value += JSON.stringify(data, null, 2);
            } else {
                output.value += "- 서버에 저장된 데이터가 없습니다.\n";
            }
         }).catch(err => {
            output.value += "- 서버 조회 중 에러 발생: " + err.message + "\n";
         });
      }
    }
  </script>
</body>
</html>
