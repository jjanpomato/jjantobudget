<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🍅🥔 짠포마토의 기록</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root {
  /* 짠토 기본 테마 (Red) */
  --bg-color: #fcf8f2;
  --main-color: #e8453c;
  --main-grad-2: #ff7043;
  --sub-color: #fddcdc;
  --sub-bg: #fff0f0;
  --sub-bg-hover: #ffe0e0;
  --text-dark: #3a1a1a;
  --text-muted: #b07070;
  --pill-bg: #f8b4b4;
  --pill-text: #7a3030;
  --input-bg: #fff9f9;
}
body.jjangam {
  /* 짠감 테마 (Brown) */
  --main-color: #a67c52;
  --main-grad-2: #c49a6c;
  --sub-color: #e6d5c3;
  --sub-bg: #f0e6d8;
  --sub-bg-hover: #e6d5c3;
  --text-dark: #3e2723;
  --text-muted: #8a6b4e;
  --pill-bg: #d9bca3;
  --pill-text: #593c22;
  --input-bg: #fcfbf8;
}
body.zzanpomato {
  /* 짠포마토 통합 테마 (Coral/Warm) */
  --main-color: #e07a5f;
  --main-grad-2: #f4a261;
  --sub-color: #f2cc8f;
  --sub-bg: #faedcd;
  --sub-bg-hover: #f2cc8f;
  --text-dark: #3d405b;
  --text-muted: #81b29a;
  --pill-bg: #f2cc8f;
  --pill-text: #e07a5f;
  --input-bg: #fff;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Poor Story",cursive;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px 60px;gap:16px;background:var(--bg-color);color:var(--text-dark); transition: background 0.3s;}
.app-header{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:1100px;position:relative;}
.header-title-row{display:flex;align-items:center;gap:8px;}
.app-header h1{font-size:clamp(22px,4vw,32px);text-shadow:2px 2px 0 rgba(0,0,0,.05);color:var(--main-color);display:flex;align-items:center;gap:6px;}
.ver{font-size:14px;background:#fff;color:var(--main-color);padding:2px 8px;border-radius:10px;border:1px solid var(--sub-color);box-shadow:0 2px 4px rgba(0,0,0,.05);}

/* 마법 복구 사이렌 효과 */
@keyframes siren {
  0% { background: #fff0f0; color: #e8453c; border-color: #e8453c; transform: scale(1); }
  50% { background: #e8453c; color: #fff; border-color: #e8453c; transform: scale(1.05); }
  100% { background: #fff0f0; color: #e8453c; border-color: #e8453c; transform: scale(1); }
}
.btn-recover {
  padding:8px 12px; border-radius:10px; font-family:'Poor Story',cursive; font-size:13px; font-weight:700; cursor:pointer;
  animation: siren 1.5s infinite; border: 2px solid #e8453c; box-shadow: 0 4px 10px rgba(232,69,60,0.3);
}

/* 프로필 스위치 */
.profile-switcher{display:flex;justify-content:center;gap:8px;width:100%;margin:5px 0 10px; flex-wrap: wrap;}
.prof-btn{padding:8px 18px;border-radius:20px;border:2px solid #ccc;background:#fff;color:#ccc;font-family:'Poor Story',cursive;font-size:15px;font-weight:700;cursor:pointer;transition:0.3s;white-space:nowrap;}
.prof-btn.active{border-color:var(--main-color);background:var(--main-color);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,0.15);transform:scale(1.05);}

.header-actions{display:flex;gap:8px;position:absolute;right:0;top:0; flex-wrap:wrap; justify-content:flex-end;}
@media(max-width:600px){.header-actions{position:static;margin-top:10px; justify-content:center;}}

.tab-bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;max-width:1100px;}
.tab-btn{padding:8px 14px;border-radius:999px;border:2px solid var(--sub-color);background:#fff;color:var(--text-muted);font-family:"Poor Story",cursive;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:0.2s;}
.tab-btn.active{color:#fff;background:linear-gradient(135deg,var(--main-color),var(--main-grad-2));border-color:transparent;}
.tab-page{display:none;width:100%;max-width:1100px;}
.tab-page.active{display:block;}

.panel{background:#fff;border:2px solid var(--sub-color);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 18px rgba(0,0,0,.05);}
.pt{font-size:15px;color:var(--main-color);font-weight:700;}
input.ti{width:100%;background:var(--input-bg);border:2px solid var(--sub-color);border-radius:10px;color:var(--text-dark);font-family:"Poor Story",cursive;font-size:13px;padding:7px 11px;outline:none;}
input.ti:focus{border-color:var(--main-color);}
.bsm{border:1.5px solid var(--sub-color);font-size:11px;padding:4px 10px;border-radius:999px;cursor:pointer;font-family:"Poor Story",cursive;font-weight:700;background:var(--sub-bg);color:var(--main-color);}
.bsm:hover{background:var(--sub-bg-hover);}
.te{width:100%;border-collapse:collapse;font-size:15px;}
.te td,.te th{border:1.5px solid var(--sub-color);padding:0;background:#fff;position:relative;}
.te th{background:var(--sub-bg);}
.te input{width:100%;background:transparent;border:none;color:var(--text-dark);padding:8px 10px;font-size:15px;font-family:"Poor Story",cursive;outline:none;}
.te input:focus{background:#fff9c4;}
.ft{display:flex;flex-direction:column;gap:16px;}
.mb{background:#fff;border:2px solid var(--sub-color);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 3px 14px rgba(0,0,0,.05);}
.mb h2{font-size:17px;white-space:nowrap;}
.sc{font-family:"Poor Story",cursive;font-size:14px;border:2px solid var(--sub-color);border-radius:10px;padding:6px 10px;background:var(--input-bg);color:var(--text-dark);outline:none;cursor:pointer;}
.pill{border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700;white-space:nowrap;background:var(--pill-bg);color:var(--pill-text);}
.sav{margin-left:auto;padding:8px 16px;border-radius:999px;color:#fff;font-family:"Poor Story",cursive;font-size:13px;font-weight:700;border:none;cursor:pointer;white-space:nowrap;background:linear-gradient(135deg,var(--main-color),var(--main-grad-2));}
.cs{background:#fff;border:2px solid var(--sub-color);border-radius:16px;padding:16px 18px;box-shadow:0 3px 14px rgba(0,0,0,.05);}
.cs h3{font-size:14px;margin-bottom:12px;}
.crow{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.dw{position:relative;flex-shrink:0;}
.dc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
.dc .dl2{font-size:12px;color:var(--text-muted);}
.dc .dv{font-size:16px;font-weight:700;}
.ll2{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px;}
.li{display:flex;align-items:center;gap:7px;font-size:14px;}
.ld{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.lp{margin-left:auto;font-weight:700;color:var(--text-muted);font-size:13px;}
.cm{background:#fff;border:2px solid var(--sub-color);border-radius:16px;padding:14px 18px;box-shadow:0 3px 14px rgba(0,0,0,.05);}
.cm h3{font-size:14px;margin-bottom:10px;}
.cw{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;font-family:"Poor Story",cursive;font-size:12px;font-weight:700;border:1.5px solid rgba(0,0,0,.08);}
.chip .xd{cursor:pointer;font-size:10px;opacity:.6;margin-left:2px;}
.chip .xd:hover{opacity:1;color:var(--main-color);}
.car{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:8px;}
.cni{font-family:"Poor Story",cursive;font-size:13px;border:2px solid var(--sub-color);border-radius:10px;padding:5px 10px;outline:none;width:120px;background:var(--input-bg);}
.cni:focus{border-color:var(--main-color);}
.pr{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px;max-width:100%;}
.pd{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;flex-shrink:0;}
.pd:hover{transform:scale(1.15);}
.pd.sel{border-color:#333;transform:scale(1.15);}
.cac{padding:6px 14px;border-radius:999px;color:#fff;font-family:"Poor Story",cursive;font-size:12px;font-weight:700;border:none;cursor:pointer;background:var(--main-color);}
.fs{background:#fff;border:2px solid var(--sub-color);border-radius:14px;padding:12px 16px;box-shadow:0 3px 14px rgba(0,0,0,.05);}
.fbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.fl{font-size:12px;color:var(--text-muted);font-weight:700;white-space:nowrap;}
.fc{padding:4px 12px;border-radius:999px;border:1.5px solid rgba(0,0,0,.1);background:#f8f8f8;color:#333;font-family:"Poor Story",cursive;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.fc.active{border-color:transparent;box-shadow:0 2px 6px rgba(0,0,0,.15);background:var(--main-color);color:#fff;}
.dtw{background:#fff;border:2px solid var(--sub-color);border-radius:16px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.05);}
.dt{width:100%;border-collapse:collapse;font-size:13px;}
.dt thead th{font-weight:700;padding:10px 12px;text-align:center;border-bottom:2px solid var(--sub-color);white-space:nowrap;background:var(--sub-bg);color:var(--main-color);}
.dt tbody tr{border-bottom:1px solid var(--sub-bg);}
.dt tbody tr:hover{background:var(--input-bg);}
.dt tbody td{padding:7px 10px;vertical-align:middle;}
.dt tbody td input{width:100%;background:transparent;border:none;font-family:"Poor Story",cursive;font-size:13px;color:var(--text-dark);outline:none;padding:2px 0;}
.dt tbody td input:focus{background:#fff9c4;border-radius:4px;padding:2px 4px;}
.dt tbody td select{background:transparent;border:none;font-family:"Poor Story",cursive;font-size:12px;color:var(--text-dark);outline:none;cursor:pointer; width:100%;}
.arb{width:100%;padding:10px;background:var(--input-bg);border:none;border-top:1.5px dashed var(--sub-color);color:var(--text-muted);font-family:"Poor Story",cursive;font-size:13px;cursor:pointer;}
.arb:hover{background:var(--sub-bg);color:var(--main-color);}
.stit{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.stit h3{font-size:13px;color:var(--text-muted);}
.stag{border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;background:var(--pill-bg);color:var(--pill-text);}
.ws{background:#fff;border:2px solid var(--sub-color);border-radius:16px;padding:16px;box-shadow:0 3px 14px rgba(0,0,0,.05);}
.wt{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}

/* 개인 영역용 컬럼 */
.as-goal-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
@media(max-width:800px){.as-goal-row{grid-template-columns:1fr;}}
.as-goal-box{background:#fff;border:2px solid var(--sub-color);border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
.as-goal-label{font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:4px;}
.as-goal-value{font-size:18px;font-weight:700;color:var(--main-color);}
.as-goal-input{font-family:"Poor Story",cursive;font-size:16px;font-weight:700;color:var(--main-color);border:2px solid var(--sub-color);background:var(--input-bg);border-radius:8px;outline:none;width:100%;padding:2px 6px;}
.as-goal-input:focus{border-color:var(--main-color);background:#fff9c4;}

.ledger-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:700px){.ledger-wrap{grid-template-columns:1fr;}}
.ledger-chart-box{background:#fff;border:2px solid var(--sub-color);border-radius:16px;padding:16px;box-shadow:0 3px 14px rgba(0,0,0,.05);}
.ledger-chart-title{font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:10px;}
.ledger-table-wrap{background:#fff;border:2px solid var(--sub-color);border-radius:16px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.05);}
.lt{width:100%;border-collapse:collapse;font-size:12px;}
.lt td,.lt th{border:1px solid var(--sub-color);padding:6px 10px;vertical-align:middle;}
.lt thead th{background:var(--sub-bg);color:var(--main-color);font-weight:700;text-align:center;}
.lt tbody tr:nth-child(even){background:var(--input-bg);}
.lt .lbl{font-weight:700;color:var(--text-dark);background:var(--bg-color);}
.lt .val{text-align:right;font-weight:700;}
.lt .over{color:var(--main-color);}
.lt .safe{color:#2e7d32;}
.lt .sub{color:#888;padding-left:20px;font-size:11px;}
.lt .grp{background:var(--sub-bg);font-weight:700;color:var(--main-color);}
.lt input.lt-inp{width:100%;border:none;background:transparent;font-family:"Poor Story",cursive;font-size:12px;color:var(--text-dark);outline:none;padding:0;}
.lt input.lt-inp:focus{background:#fff9c4;border-radius:3px;padding:1px 3px;}

@media (max-width: 600px) {
  .lt, .dt, .te { font-size: 14px !important; }
  .lt input.lt-inp, .dt tbody td input { font-size: 14px !important; padding: 8px 4px !important; }
  .lt td, .lt th, .dt tbody td, .dt thead th { padding: 10px 6px !important; }
  .ledger-table-wrap, .dtw { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
  .lt td.lbl, .dt tbody td:first-child { white-space: nowrap; }
}

/* 모달창 */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;}
.mo.open{display:flex;}
.mb2{background:#fff;border-radius:20px;padding:24px;max-width:560px;width:92%;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto;}
.mt2{font-size:16px;font-weight:700;}
.mf{width:100%;border-radius:12px;overflow:hidden;border:2px solid var(--sub-color);}
.mc{width:100%;display:flex;flex-direction:column;padding:20px;position:relative;overflow:hidden;gap:8px;background:linear-gradient(135deg,var(--bg-color),var(--sub-bg));}
.mbs{display:flex;gap:10px;}
.mbs button{flex:1;padding:10px;border-radius:12px;font-family:"Poor Story",cursive;font-size:14px;font-weight:700;border:none;cursor:pointer;}
.mcl{background:#f0f0f0;color:#666;}
.mrb{display:flex;gap:6px;}
.mrb button{flex:1;padding:6px;border-radius:9px;border:2px solid var(--sub-color);background:var(--input-bg);color:var(--text-muted);font-size:12px;font-family:"Poor Story",cursive;font-weight:700;cursor:pointer;}
.mrb button.active{color:#fff;border-color:transparent;background:var(--main-color);}
.wcard{background:#fff;border:2px solid var(--sub-color);border-radius:16px;padding:14px;box-shadow:0 3px 14px rgba(0,0,0,.05);}
.wcard-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.wcard-hd h3{font-size:14px;font-weight:700;color:var(--main-color);}
.wdate-inp{font-family:"Poor Story",cursive;font-size:12px;border:2px solid var(--sub-color);border-radius:8px;padding:3px 8px;background:var(--input-bg);color:var(--text-dark);outline:none;width:120px;}
.wdate-inp:focus{border-color:var(--main-color);}
.wtotal-badge{margin-left:auto;background:var(--pill-bg);color:var(--pill-text);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;}

/* 🍅🥔 조인트 목표 탭 커스텀 게이지 */
.joint-prog-bg { width:100%; background:var(--input-bg); border-radius:12px; height:26px; overflow:hidden; border:2px solid var(--sub-color); position:relative; margin-top:5px; }
.joint-prog-bar { height:100%; background:linear-gradient(90deg, #e07a5f, #f4a261); width:0%; transition:0.8s ease-out; }
.card-grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-top:10px; }
@media(max-width:600px){ .card-grid { grid-template-columns: 1fr; } }
</style>

const cc=(cats,n)=>{const c=cats.find(x=>x.name===n);return c?c.color:"#fff";};
const getCatOptionsHtml=(cats, s)=>{ let h=""; let f=false; (cats||[]).forEach(c=>{ h+=`<option value="${c.name}" ${c.name===s?"selected":""}>${c.name}</option>`; if(c.name===s)f=true;}); if(s&&!f)h+=`<option value="${s}" selected>${s}</option>`; else if(!s) h=`<option value="" selected>선택</option>`+h; return h; };

function drawDonut(cid,items,vid,lid){
  const canvas=document.getElementById(cid);if(!canvas)return;
  const ctx=canvas.getContext("2d"); const w=canvas.width,h=canvas.height,r=Math.min(w,h)/2-8,cx=w/2,cy=h/2;
  ctx.clearRect(0,0,w,h);
  const total=items.reduce((s,it)=>s+(+it.amount||0),0);
  if(vid)document.getElementById(vid).textContent="₩"+fmt(total);
  if(lid){
    const ll=document.getElementById(lid);ll.innerHTML="";
    items.forEach(it=>{if(!it.amount||+it.amount===0)return;const pct=total?Math.round((+it.amount/total)*100):0;
    const li=document.createElement("div");li.className="li";li.innerHTML=`<div class="ld" style="background:${it.color}"></div><span>${it.name}</span><span class="lp">₩${fmt(it.amount)} (${pct}%)</span>`;ll.appendChild(li);});
  }
  if(total===0){ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.lineWidth=22;ctx.strokeStyle="#f0f0f0";ctx.stroke();return;}
  let angle=-Math.PI/2;
  items.forEach(it=>{
    if(!it.amount||+it.amount===0)return; const sweep=(+it.amount/total)*2*Math.PI;
    ctx.beginPath();ctx.arc(cx,cy,r,angle,angle+sweep); ctx.lineWidth=22;ctx.strokeStyle=it.color;ctx.stroke(); angle+=sweep;
  });
  ctx.beginPath();ctx.arc(cx,cy,r-10,0,2*Math.PI);ctx.fillStyle="#fff";ctx.fill();
}

}

  row("부수입", iT, "inc");

const SC_RULES_DEF=()=>[["🍅 달성률 10%당 1스쿱🥄"],["🍅 네잎클로버 파츠는 한 번 더!🍀"],["🍅 100% 달성시 한 번 더! ✨"],["🍅 큰 파츠 개당 1,000원💎"],["🍅 주간 총 금액 다음 주에 매수! 💸"]];
function gScRules(y,m){
  if(!scD[y])scD[y]={}; if(!scD[y][m])scD[y][m]={};
  let r = ensureArr(scD[y][m].rules); if(r.length===0) r=SC_RULES_DEF();
  scD[y][m].rules = r.filter(x=>{const v=Array.isArray(x)?x[0]:x;return v!=='규칙'&&v!=='규칙:내용';}); sSc(); return scD[y][m].rules;
}
const SC_WK_DEF=(wk)=>({ dateRange: wk===1?"8/1~8/7":wk===2?"8/8~8/14":wk===3?"8/15~8/21":"8/22~8/28", rows:[{label:"달성률 ✨",vals:["","","","","","",""]},{label:"스쿱 🥄",vals:["","","","","","",""]},{label:"보너스 🍀",vals:["","","","","","",""]},{label:"보너스 🍅",vals:["","","","","","",""]},{label:"큰파츠 💎",vals:["","","","","","",""]},{label:"총 금액 💰",vals:["","","","","","",""]}], weekTotal:""});
function gScWk(y,m,wk){
  if(!scD[y])scD[y]={}; if(!scD[y][m])scD[y][m]={}; if(!scD[y][m]["w"+wk])scD[y][m]["w"+wk]=SC_WK_DEF(wk);
  scD[y][m]["w"+wk].rows=ensureArr(scD[y][m]["w"+wk].rows);
  if(scD[y][m]["w"+wk].rows.length===0) scD[y][m]["w"+wk].rows=SC_WK_DEF(wk).rows;
  return scD[y][m]["w"+wk];
}

/* ================= 🍅🥔 짠포마토(통합) 대시보드 로직 ================= */
function getNetWorth(p) {
  if(!appData[p] || !appData[p].asD || !appData[p].asD.main) return 0;
  const d = appData[p].asD.main;
  let assets = 0, liabs = 0;
  ensureArr(d.details).forEach(r => assets += (+r.amt||0));
  ensureArr(d.cashDetails).forEach(r => assets += (+r.amt||0));
  ensureArr(d.liabilities).forEach(r => liabs += (+r.amt||0));
  return assets - liabs;
}

function getMonthlyStats(p, y, m) {
  let inc=0, exp=0, inv=0;
  if(appData[p]) {
     const i = appData[p].iD && appData[p].iD[y] && appData[p].iD[y][m] ? appData[p].iD[y][m] : {fixed:[],dated:[]};
     const e = appData[p].eD && appData[p].eD[y] && appData[p].eD[y][m] ? appData[p].eD[y][m] : {fixed:[],dated:[]};
     const l = appData[p].lgD && appData[p].lgD[y] && appData[p].lgD[y][m] ? appData[p].lgD[y][m] : {salary:0};
     const n = appData[p].nvD && appData[p].nvD[y] && appData[p].nvD[y][m] ? appData[p].nvD[y][m] : {manualTotal:0};
     
     inc = ensureArr(i.fixed).concat(ensureArr(i.dated)).reduce((s,r)=>s+(+r.amount||0),0) + (+l.salary||0);
     exp = ensureArr(e.fixed).concat(ensureArr(e.dated)).reduce((s,r)=>s+(+r.amount||0),0);
     inv = +(n.manualTotal)||0;
  }
  return { inc, exp, inv };
}

let rChartInst1 = null; let rChartInst2 = null;
function rReport() {
  rY = parseInt(document.getElementById("ry").value) || CUR_Y;
  let mInc=[], mExp=[], mSav=[], mBal=[];
  let yInc=0, yExp=0, ySav=0, yBal=0;

  for(let m=1; m<=12; m++) {
    let stat = getMonthlyStats(activeProfile, rY, m);
    mInc.push(stat.inc); yInc+=stat.inc;
    mExp.push(stat.exp); yExp+=stat.exp;
    mSav.push(stat.inv); ySav+=stat.inv;
    mBal.push(stat.inc - stat.exp); yBal+=(stat.inc - stat.exp);
  }

  document.getElementById("r_tot_inc").textContent="₩"+fmt(yInc);
  document.getElementById("r_tot_exp").textContent="₩"+fmt(yExp);
  document.getElementById("r_tot_sav").textContent="₩"+fmt(ySav);
  document.getElementById("r_tot_bal").textContent="₩"+fmt(yBal);
  document.getElementById("r_tot_bal").style.color = yBal<0 ? "var(--main-color)" : "#2e7d32";

  if(rChartInst1) rChartInst1.destroy(); if(rChartInst2) rChartInst2.destroy();
  const c1 = document.getElementById("rChart1").getContext("2d");
  rChartInst1 = new Chart(c1, { type: 'bar', data: { labels: ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'], datasets: [{label:'수입',data:mInc,backgroundColor:'#baffc9'},{label:'지출',data:mExp,backgroundColor:'#ffb3ba'},{label:'저축',data:mSav,backgroundColor:'#bae1ff'}] }, options: {responsive:true} });
  const c2 = document.getElementById("rChart2").getContext("2d");
  rChartInst2 = new Chart(c2, { type: 'line', data: { labels: ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'], datasets: [{label:'잔액',data:mBal,borderColor:'#ccc',backgroundColor:'rgba(200,200,200,0.2)',fill:true,tension:0.3}] }, options: {responsive:true} });
}

/* 랜덤스쿱 카드 모달용 */
window.oSM = function(){ document.getElementById("scmo").classList.add("open"); bScCard(); };
window.sSR = function(btn,rat){ scRat=rat; document.querySelectorAll("#scmo .mrb button").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); bScCard(); };
window.sSW = function(btn,wk){ scWk=wk; document.querySelectorAll("#scmo .fc").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); bScCard(); };
function bScCard(){
  const mc=document.getElementById("scmc");mc.innerHTML=""; mc.className="cd-inner";
  if(scWk===0){
    let totalAll=0;let rows="";
    for(let wk=1;wk<=4;wk++){
      const wd=gScWk(scY,scM,wk); const wt=+wd.weekTotal||0;totalAll+=wt;
      rows+=`<div class="cd-row"><span class="cd-label">${wk}주차 ${wd.dateRange||""}</span><span class="cd-value">₩${fmt(wt)}</span></div>`;
    }
    mc.innerHTML=`<div style="font-size:22px;font-weight:700;color:var(--main-color);margin-bottom:8px;">🥄 ${scY}년 ${scM}월 랜덤스쿱</div>${rows}
      <div class="cd-row" style="background:var(--sub-bg);border-radius:8px;padding:6px 8px;margin-top:4px;"><span class="cd-label">월 합계</span><span class="cd-value" style="color:var(--main-color);">₩${fmt(totalAll)}</span></div>`;
  } else {
    const wd=gScWk(scY,scM,scWk); const days=["월","화","수","목","금"]; let rows="";
    ensureArr(wd.rows).forEach(row=>{
      rows+=`<div class="cd-section">${row.label}</div><div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:4px;">`;
      ensureArr(row.vals).forEach((v,i)=>{ if(i<5) rows+=`<div style="text-align:center;background:var(--sub-bg);border-radius:6px;padding:4px 2px;font-size:11px;min-width:0;"><div style="font-size:9px;color:var(--text-muted);margin-bottom:2px;">${days[i]}</div><div style="font-weight:700;color:var(--text-dark);">${v||"—"}</div></div>`; });
      rows+="</div>";
    });
    mc.innerHTML=`<div style="font-size:22px;font-weight:700;color:var(--main-color);margin-bottom:8px;">🥄 ${scWk}주차 ${wd.dateRange||""}</div>${rows}
      <div class="cd-row" style="background:var(--sub-bg);border-radius:8px;padding:6px 8px;margin-top:6px;"><span class="cd-label">주간 합계</span><span class="cd-value" style="color:var(--main-color);">₩${fmt(wd.weekTotal)}</span></div>`;
  }
}
window.dSC = function(){
  const mb2 = document.querySelector("#scmo .mb2"); const oldMax = mb2.style.maxHeight; const oldOver = mb2.style.overflowY;
  mb2.style.maxHeight = "none"; mb2.style.overflowY = "visible";
